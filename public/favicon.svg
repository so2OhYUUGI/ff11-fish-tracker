<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <!-- 背景（ダークブルーの丸角） -->
  <rect width="32" height="32" rx="7" fill="#0f172a" />
  
  <!-- 釣糸 -->
  <line x1="16" y1="2" x2="16" y2="8" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  
  <!-- 釣針（フック） -->
  <path d="M 16 8 
           A 2 2 0 0 1 16 12 
           V 20 
           A 5 5 0 0 0 26 20 
           V 16" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
        
  <!-- 針の返しの装飾 / 光沢 -->
  <circle cx="16" cy="10" r="1" fill="#38bdf8" />
  
  <!-- 水面・波紋のアクセント -->
  <path d="M 6 24 Q 10 22, 14 24 T 22 24" 
        fill="none" 
        stroke="#0284c7" 
        stroke-width="1.5" 
        stroke-linecap="round" 
        opacity="0.6" />
</svg>
